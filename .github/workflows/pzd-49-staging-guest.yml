name: PZD-49 staging guest auth checks
on:
  pull_request:
    paths:
      - "src/staging/**"
      - "test/staging/**"
      - "docs/staging/PZD-49-GUEST-SCHEMA-CANDIDATE.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pzd-49-staging-guest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test 'test/staging/*.test.mts'
      - run: npm run typecheck
