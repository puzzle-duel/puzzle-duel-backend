name: PZD-49 staging guest auth checks
on:
  pull_request:
    paths:
      - "src/staging/**"
      - "test/staging/**"
      - "migrations/staging/**"
      - "docs/staging/PZD-49-GUEST-SCHEMA-CANDIDATE.sql"
      - "docs/staging/PZD-26-PROVIDER-AUTH-CONTRACT.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pzd-49-staging-guest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pzd
          POSTGRES_PASSWORD: pzd
          POSTGRES_DB: pzd_provider_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pzd -d pzd_provider_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PZD_TEST_DATABASE_URL: postgresql://pzd:pzd@127.0.0.1:5432/pzd_provider_auth_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Staging unit + runtime-role PostgreSQL integration
        run: node --experimental-strip-types --test --test-concurrency=1 'test/staging/**/*.test.mts'
      - run: npm run typecheck
