name: PZD-49 Backend staging CD

on:
  pull_request:
    branches: [main, "version/0.0.1"]
    paths:
      - ".github/workflows/staging-cd.yml"
      - "ops/staging/**"
  push:
    branches: [main, "version/0.0.1"]
    paths:
      - ".github/workflows/staging-cd.yml"
      - "ops/staging/**"
      - "src/**"
      - "package*.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pzd-staging-cd
  cancel-in-progress: false

jobs:
  verify:
    name: Verify staging candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify staging guest-auth and route safety
        run: |
          npm run test:staging
          node --experimental-strip-types --test 'test/staging/*.test.mts'
      # PostgreSQL-backed F1/F2 suites run in the existing Stage E PostgreSQL CI.
      # Do not run them here without a provisioned PG18 service and URL.
      - name: Verify deploy scripts
        run: |
          set -euo pipefail
          bash -n ops/staging/deploy-remote.sh
          test -f ops/staging/README.md
          ! grep -Eq 'systemctl restart forest-dash|/var/www/forest-dash' ops/staging/deploy-remote.sh

  deploy:
    name: Deploy to isolated Puzzle Duel staging
    needs: verify
    # Immutable version branch only; require two independently provisioned gates.
    # A green verification job alone must never authorize a live host mutation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/version/0.0.1' && vars.PZD_STAGING_CD_ENABLED == 'true' && vars.PZD_STAGING_RELEASE_001_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pzd-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --omit=dev
      - name: Package immutable source
        run: |
          set -euo pipefail
          tar -czf /tmp/pzd-staging-release.tgz --exclude=.git --exclude=.github --exclude=node_modules --exclude=ops/staging/deploy-remote.sh src docs/contracts/gameplay/v3/fixtures docs/tournament/uat-challenges/v4 migrations package.json package-lock.json tsconfig.json
      - name: Install pinned SSH host identity
        env:
          SSH_KEY: ${{ secrets.PZD_STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PZD_STAGING_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.PZD_STAGING_HOST }}
          USER: ${{ secrets.PZD_STAGING_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST" && test -n "$USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy preprovisioned isolated service and smoke test
        env:
          HOST: ${{ secrets.PZD_STAGING_HOST }}
          USER: ${{ secrets.PZD_STAGING_USER }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          scp $SSH_OPTS /tmp/pzd-staging-release.tgz "$USER@$HOST:pzd-staging-release.tgz"
          ssh $SSH_OPTS "$USER@$HOST" "bash -s -- '$COMMIT_SHA'" < ops/staging/deploy-remote.sh
