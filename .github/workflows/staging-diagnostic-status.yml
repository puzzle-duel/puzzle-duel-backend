                      stream.seek(0,os.SEEK_END)
                      size=stream.tell()
                      count=min(size,remaining)
                      stream.seek(size-count)
                      chunk=stream.read(count)
                      # A partial first JSONL record is never parsed.
                      if count<size:
                          chunk=chunk.partition(b'\n')[2]
                      chunks.insert(0,chunk)
                      remaining-=count
                  if remaining<=0: break
              return b'\n'.join(chunks).splitlines()
          http=[]
          if recent:
              lines=latest_http_bytes()
          else:
              lines=[]
              for path in (base+'.1',base):
                  if not check_file(path,25*1024*1024): continue
                  with open(path,'rb') as stream:
                      lines.extend(stream)
          for line in lines:
              try: e=json.loads(line)
              except (ValueError,TypeError,UnicodeDecodeError): continue
              if not isinstance(e,dict) or e.get('code')!='http_completed': continue
              if not recent and e.get('requestId') not in req_ids: continue
              if type(e.get('status')) is not int or not 100<=e['status']<=599: continue
              http.append(e)
          if recent:
              # Correlate the same retained HTTP request IDs with available
              # submitted diagnostics without including unrelated reports.
              backend_ids={e.get('requestId') for e in http if isinstance(e.get('requestId'),str)}
              for events in report_files:
                  selected.extend(e for e in events if e.get('requestId') in backend_ids)
          print('## Staging Unified Request Log Inspector')
          if recent:
              print('Mode: latest 1 MiB of retained backend HTTP diagnostics (active, then rotated).')
              print('Matching submitted client diagnostic events are included when their request IDs are retained.')
          else:
              print('Mode: exact requestId/reportId correlation; no unrelated accounts.')
          print('Sanitized metadata only: no identifiers, timestamps, secrets, payloads, IPs or raw events.')
          print()
          print('### Every recorded matching HTTP status')
          print('| # | Method | Route | HTTP | Outcome | Duration | Error code |')
          print('| ---: | --- | --- | ---: | --- | ---: | --- |')
          for n,e in enumerate(http[:10000],1):
              duration=e.get('durationMs')
              duration=str(round(duration))+'ms' if type(duration) in (int,float) and 0<=duration<=120000 else 'n/a'
              print('| %d | %s | %s | %d | %s | %s | %s |' %
                    (n,safe(e.get('method'),{'GET','POST','PATCH','PUT','DELETE','OTHER'}),
                     safe(e.get('route'),allowed_routes),e['status'],
                     safe(e.get('outcome'),{'ok','client_error','server_error','network_error'}),
                     duration,safe(e.get('errorCode'),allowed_codes)))
          if not http: print('| — | — | — | — | — | — | Not retained |')
          print()
          print('### HTTP status counts')
          for code,count in sorted(collections.Counter(e['status'] for e in http).items()):
              print('- HTTP %d: %d' % (code,count))
          if not http: print('- No retained HTTP match')
          print()
          print('### Matching client diagnostic events')
          print('| # | Event | Operation | Method | HTTP | Duration | Error code |')
          print('| ---: | --- | --- | --- | ---: | ---: | --- |')
          for n,e in enumerate(selected[:10000],1):
              op=e.get('operation')
              op=op if isinstance(op,str) and re.fullmatch(r'[a-zA-Z0-9_-]{1,64}',op) else 'not_recorded'
              status=e.get('httpStatus')
              status=str(status) if type(status) is int and 100<=status<=599 else 'n/a'
              duration=e.get('durationMs')
              duration=str(duration)+'ms' if type(duration) is int and 0<=duration<=120000 else 'n/a'
              print('| %d | %s | %s | %s | %s | %s | %s |' %
                    (n,safe(e.get('code'),allowed_events),op,
                     safe(e.get('httpMethod'),{'GET','POST','PATCH','PUT','DELETE'}),
                     status,duration,safe(e.get('errorCode'),allowed_codes)))
          if not selected: print('| — | — | — | — | — | — | Not retained |')
          print()
          print('Scope: current/.1 backend HTTP metadata and 24h private client reports.')
          print('Missing correlation or unlogged events cannot be reconstructed retroactively.')
          if len(http)>10000 or len(selected)>10000: print('Output truncated at 10,000 rows per category.')
          PY
