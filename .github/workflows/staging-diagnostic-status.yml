name: PZD Staging Diagnostic Report Status

# Read-only inspection: never downloads full logs, rotates files, restarts services,
# deploys, or prints sensitive data. This repository is PUBLIC: workflow output
# and job summaries are public too. Expose only aggregate HTTP status metadata.
on:
  push:
    branches: [version/0.0.2]
    paths: [.github/workflows/staging-diagnostic-status.yml]
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Optional 32-character hex request ID from Crashlytics (no token or report payload)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pzd-staging-diagnostic-readonly
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect recent diagnostic report statuses (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pzd-staging
    steps:
      - name: Configure pinned staging SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PZD_STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PZD_STAGING_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.PZD_STAGING_HOST }}
          USER: ${{ secrets.PZD_STAGING_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST" && test -n "$USER"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Summarize diagnostic report HTTP statuses, without exposing raw log
        shell: bash
        env:
          HOST: ${{ secrets.PZD_STAGING_HOST }}
          USER: ${{ secrets.PZD_STAGING_USER }}
          TARGET_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ -n "$TARGET_REQUEST_ID" && ! "$TARGET_REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo 'request_id must be a lowercase 32-character hex value' >&2
            exit 2
          fi
          # Execute only a constant, read-only Python script on Oracle. Never
          # stream raw logs to GitHub's public runners or Action output.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 "$USER@$HOST" "python3 - '$TARGET_REQUEST_ID'" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections
          import json
          import os
          import re
          import stat
          import sys

          target = sys.argv[1] if len(sys.argv) > 1 else ''
          if target and not re.fullmatch(r'[0-9a-f]{32}', target):
              sys.exit('Invalid request ID')
          base = '/home/pzd-staging/pzd-staging/http-diagnostics.log'
          # Reject arbitrary metadata from the log. The repository/run is public.
          routes = {
              'tournament_session', 'tournament_manifest', 'tournament_command',
              'tournament_series', 'tournament_other', 'leaderboard_daily',
              'leaderboard_weekly', 'guest_auth', 'diagnostic_report', 'other',
          }
          errors = {
              'UNAUTHENTICATED', 'NOT_FOUND', 'MALFORMED_REQUEST', 'RATE_LIMITED',
              'AUTH_UNAVAILABLE', 'TOURNAMENT_UNAVAILABLE', 'STALE_WRITER',
              'WRITER_NOT_AUTHORIZED', 'WRITER_STILL_ACTIVE', 'SERIES_NOT_OWNED',
              'SERIES_STATE_INCONSISTENT', 'SERIES_STATE_CORRUPT', 'SERIES_TERMINAL',
              'RECOVERY_NOT_ELIGIBLE', 'RECOVERY_PROOF_INVALID', 'PLAYER_MISMATCH',
              'IDLE_EXPIRED', 'HARD_CUTOFF_EXPIRED', 'SNAPSHOT_CHANGED',
              'INVALID_REFRESH', 'REFRESH_REPLAY', 'REFRESH_EXPIRED',
              'TOKEN_FORMAT_INVALID', 'TOKEN_NOT_FOUND', 'FAMILY_REVOKED', 'FAMILY_MISSING',
              'GUEST_LOGOUT_REVOKED',
          }
          records = []
          for path in (base + '.1', base):
              try:
                  info = os.lstat(path)
                  if not stat.S_ISREG(info.st_mode):
                      sys.exit('Diagnostic log is not a regular file')
                  with open(path, encoding='utf-8') as handle:
                      for line in handle:
                          try:
                              entry = json.loads(line)
                          except (ValueError, TypeError):
                              continue
                          if not isinstance(entry, dict):
                              continue
                          status = entry.get('status')
                          if type(status) is not int or not 100 <= status <= 599:
                              continue
                          op = entry.get('operation')
                          if op not in ('diagnostic_report', 'tournament_http'):
                              continue
                          route = entry.get('route')
                          route = route if isinstance(route, str) and route in routes else 'unknown'
                          error = entry.get('errorCode')
                          error = error if isinstance(error, str) and error in errors else 'not_recorded'
                          rid = entry.get('requestId')
                          records.append((status, op, route, error, rid))
              except FileNotFoundError:
                  continue
              except (OSError, UnicodeError):
                  sys.exit('Unable to read staging diagnostic metadata')

          print('## Puzzle Duel staging HTTP diagnostics')
          print()
          print('Public-safe: only HTTP status, static route category and allowlisted error code.')
          print('No raw report events, player IDs, request IDs, IPs, tokens or timestamps are printed.')
          print()
          reports = [r for r in records if r[1] == 'diagnostic_report'][-50:]
          counts = collections.Counter(r[0] for r in reports)
          print('Diagnostic submissions inspected: **%d** (maximum 50)' % len(reports))
          print()
          print('| HTTP status | Count |')
          print('| --- | ---: |')
          for status, count in sorted(counts.items()):
              print('| %d | %d |' % (status, count))
          print()
          if reports:
              print('Latest diagnostic statuses: `%s`' %
                    ' → '.join(str(r[0]) for r in reports[-15:]))
          print()
          failures = [r for r in records if r[1] == 'tournament_http' and r[0] >= 400][-20:]
          print('### Recent tournament failures (maximum 20)')
          print()
          print('| HTTP | Route | Safe backend error code |')
          print('| --- | --- | --- |')
          for status, _, route, error, _ in failures:
              # No individual guest-token subreason in public per-request rows.
              shown = 'INVALID_REFRESH' if route == 'guest_auth' and error in (
                  'TOKEN_FORMAT_INVALID', 'TOKEN_NOT_FOUND', 'FAMILY_REVOKED', 'FAMILY_MISSING') else error
              print('| %d | %s | %s |' % (status, route, shown))
          if not failures:
              print('No tournament failures in retained metadata log files.')
          refresh_failures = [r for r in records if r[1] == 'tournament_http' and
                              r[2] == 'guest_auth' and r[0] == 401 and
                              r[3] in ('INVALID_REFRESH', 'REFRESH_REPLAY', 'REFRESH_EXPIRED',
                                       'TOKEN_FORMAT_INVALID', 'TOKEN_NOT_FOUND', 'FAMILY_REVOKED', 'FAMILY_MISSING')]
          print()
          print('### Guest refresh failures (allowlisted categories only)')
          print()
          print('| Safe backend error code | Count |')
          print('| --- | ---: |')
          for code, count in sorted(collections.Counter(r[3] for r in refresh_failures[-50:]).items()):
              print('| %s | %d |' % (code, count))
          if not refresh_failures:
              print('No classified guest refresh failures in retained metadata.')
          print()
          print('### Revocation origin events (only after audit logging deployment)')
          print()
          audit = [r[3] for r in records if r[2] == 'guest_auth' and
                   r[3] in ('REFRESH_REPLAY', 'GUEST_LOGOUT_REVOKED')]
          print('| Fixed origin | Coarse count |')
          print('| --- | ---: |')
          for key, count in sorted(collections.Counter(audit).items()):
              print('| %s | %s |' % (key, 'suppressed (1–4)' if count < 5 else '5–19' if count < 20 else '20+'))
          if not audit:
              print('No classified revocation origin events in retained metadata.')
          if target:
              print()
              print('### Requested correlation')
              found = next((r for r in reversed(records) if r[4] == target), None)
              if found:
                  print('Request ID matched in retained Oracle metadata.')
                  safe_code = 'INVALID_REFRESH' if found[2] == 'guest_auth' and found[3] in (
                      'TOKEN_FORMAT_INVALID', 'TOKEN_NOT_FOUND', 'FAMILY_REVOKED', 'FAMILY_MISSING') else found[3]
                  print('HTTP: **%d**; route: **%s**; safe error code: **%s**' %
                        (found[0], found[2], safe_code))
              else:
                  print('No matching request ID in current or rotated Oracle metadata logs.')
                  print('The request may predate retention or the logging enhancement.')
          print()
          print('A not_recorded code on older entries cannot be recovered retroactively.')
          print('Diagnostic report contents are not available through this Action.')
          PY


      - name: Inspect staging guest credential health (read-only, privacy-thresholded)
        shell: bash
        env:
          HOST: ${{ secrets.PZD_STAGING_HOST }}
          USER: ${{ secrets.PZD_STAGING_USER }}
        run: |
          set -euo pipefail
          # Queries run on Oracle, not the public GitHub runner. Only coarse
          # status buckets cross the SSH boundary; no row-level data is emitted.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 "$USER@$HOST" \
            'cd /home/pzd-staging/pzd-staging/current && /opt/pzd-node26/bin/node --input-type=module -' <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          import pg from 'pg';

          // This is a public repository: never print the DSN, SQL row values,
          // tokens, hashes, player IDs, family IDs, request payloads or errors.
          const bucket = (value) => {
            const n = Number(value);
            if (!Number.isSafeInteger(n) || n < 0) throw new Error('Invalid aggregate');
            if (n === 0) return 'none';
            if (n < 5) return 'suppressed (1–4)';
            if (n < 20) return '5–19';
            return '20+';
          };
          let db;
          try {
            const env = readFileSync('/home/pzd-staging/pzd-staging/staging.env', 'utf8');
            const line = env.split(/\r?\n/).find(x => /^PZD_STAGING_DATABASE_URL=/.test(x));
            if (!line) throw new Error('Missing config');
            let value = line.slice('PZD_STAGING_DATABASE_URL='.length).trim();
            if ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
            const url = new URL(value);
            if (!['127.0.0.1', 'localhost'].includes(url.hostname) ||
                url.pathname !== '/pzd_staging') throw new Error('Wrong database');
            db = new pg.Client({ connectionString: value, connectionTimeoutMillis: 3000 });
            await db.connect();
            await db.query('BEGIN TRANSACTION READ ONLY');
            await db.query("SET LOCAL statement_timeout = '3000ms'");
            const schema = await db.query(
              "SELECT to_regclass('public.pzd_guest_families') IS NOT NULL AS families, " +
              "to_regclass('public.pzd_guest_refresh') IS NOT NULL AS refresh"
            );
            if (!schema.rows[0]?.families || !schema.rows[0]?.refresh) throw new Error('Schema missing');
            const families = await db.query(
              "SELECT COUNT(*)::int AS total, " +
              "COUNT(*) FILTER (WHERE revoked_at IS NULL)::int AS active, " +
              "COUNT(*) FILTER (WHERE revoked_at IS NOT NULL)::int AS revoked " +
              "FROM public.pzd_guest_families"
            );
            const refresh = await db.query(
              "SELECT COUNT(*)::int AS total, " +
              "COUNT(*) FILTER (WHERE r.used_at IS NOT NULL)::int AS used, " +
              "COUNT(*) FILTER (WHERE r.used_at IS NULL AND r.expires_at <= now())::int AS expired_unused, " +
              "COUNT(*) FILTER (WHERE r.used_at IS NULL AND r.expires_at > now() AND f.revoked_at IS NULL)::int AS usable, " +
              "COUNT(*) FILTER (WHERE f.revoked_at IS NOT NULL)::int AS revoked_family_tokens " +
              "FROM public.pzd_guest_refresh r JOIN public.pzd_guest_families f USING (family_id)"
            );
            await db.query('ROLLBACK');
            const f = families.rows[0], t = refresh.rows[0];
            console.log('### Staging guest credential DB health (aggregate only)');
            console.log();
            console.log('Read-only transaction; values below five are suppressed. No account or token can be identified.');
            console.log('| Category | Coarse count |');
            console.log('| --- | --- |');
            for (const [label, count] of [
              ['Guest families', f.total],
              ['Active families', f.active],
              ['Revoked families', f.revoked],
              ['Refresh rows', t.total],
              ['Used refresh rows', t.used],
              ['Expired unused refresh rows', t.expired_unused],
              ['Currently usable refresh rows', t.usable],
              ['Refresh rows in revoked families', t.revoked_family_tokens],
            ]) console.log('| ' + label + ' | ' + bucket(count) + ' |');
            console.log();
            console.log('This describes staging-wide state; it cannot prove which state belongs to the iPhone.');
          } catch {
            console.log('Guest credential DB inspection unavailable (details withheld).');
            process.exitCode = 1;
          } finally {
            if (db) await db.end().catch(() => {});
          }
          JS


      - name: Examine historical revocation time windows (read-only, coarse buckets only)
        shell: bash
        env:
          HOST: ${{ secrets.PZD_STAGING_HOST }}
          USER: ${{ secrets.PZD_STAGING_USER }}
        run: |
          set -euo pipefail
          # All raw dates and row-level data remain on Oracle.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 "$USER@$HOST" \
            'cd /home/pzd-staging/pzd-staging/current && /opt/pzd-node26/bin/node --input-type=module -' <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          import pg from 'pg';
          const bucket = n => {
            n = Number(n);
            if (!Number.isSafeInteger(n) || n < 0) throw new Error('Invalid aggregate');
            return n === 0 ? 'none' : n < 5 ? 'suppressed (1–4)' : n < 20 ? '5–19' : '20+';
          };
          let db;
          try {
            const config = readFileSync('/home/pzd-staging/pzd-staging/staging.env', 'utf8');
            const line = config.split(/\r?\n/).find(x => /^PZD_STAGING_DATABASE_URL=/.test(x));
            if (!line) throw new Error('Missing staging DSN');
            let value = line.slice('PZD_STAGING_DATABASE_URL='.length).trim();
            if ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
            const url = new URL(value);
            if (!['127.0.0.1', 'localhost'].includes(url.hostname) ||
                url.pathname !== '/pzd_staging') throw new Error('Refused non-staging DB');
            db = new pg.Client({ connectionString: value, connectionTimeoutMillis: 3000 });
            await db.connect();
            await db.query('BEGIN TRANSACTION READ ONLY');
            await db.query("SET LOCAL statement_timeout = '3000ms'");
            const result = await db.query(
              "SELECT COUNT(*)::int AS revoked, " +
              "COUNT(*) FILTER (WHERE f.revoked_at >= TIMESTAMPTZ '2026-11-22 00:00:00+00' AND " +
              "  f.revoked_at < TIMESTAMPTZ '2026-11-22 00:10:00+00')::int AS near_cutover, " +
              "COUNT(*) FILTER (WHERE f.revoked_at < TIMESTAMPTZ '2026-11-22 00:00:00+00')::int AS before_cutover, " +
              "COUNT(*) FILTER (WHERE f.revoked_at >= TIMESTAMPTZ '2026-11-22 00:10:00+00')::int AS after_cutover, " +
              "COUNT(*) FILTER (WHERE latest.used_at IS NOT NULL AND latest.used_at < f.revoked_at)::int AS previously_rotated " +
              "FROM public.pzd_guest_families f LEFT JOIN LATERAL " +
              "(SELECT MAX(r.used_at) AS used_at FROM public.pzd_guest_refresh r WHERE r.family_id = f.family_id) latest ON true " +
              "WHERE f.revoked_at IS NOT NULL"
            );
            await db.query('ROLLBACK');
            const row = result.rows[0];
            console.log('### Historical revocation timing (coarse and anonymous)');
            console.log();
            console.log('UTC crossover: 2026-11-22 00:00 UTC (03:00 Türkiye).');
            console.log('Exact revoked_at timestamps, identities, and rows never leave Oracle.');
            console.log('| Cohort | Coarse count |');
            console.log('| --- | --- |');
            for (const [label, count] of [
              ['All revoked families', row.revoked],
              ['Revoked before crossover', row.before_cutover],
              ['Revoked between 00:00 and 00:10 UTC', row.near_cutover],
              ['Revoked after 00:10 UTC', row.after_cutover],
              ['Revoked families with earlier used refresh', row.previously_rotated],
            ]) console.log('| ' + label + ' | ' + bucket(count) + ' |');
            console.log();
            console.log('Earlier used refresh is compatible with replay OR logout; NOT causal proof.');
            console.log('Past revocation origin was not persisted; no account attribution is possible.');
          } catch {
            console.log('Historical revocation timing unavailable (details withheld).');
            process.exitCode = 1;
          } finally {
            if (db) await db.end().catch(() => {});
          }
          JS


      - name: Check revoked guest account evidence without identity disclosure (read-only)
        shell: bash
        env:
          HOST: ${{ secrets.PZD_STAGING_HOST }}
          USER: ${{ secrets.PZD_STAGING_USER }}
        run: |
          set -euo pipefail
          # Public workflow: do NOT return row-level results, device key fingerprints,
          # player identifiers, guest tokens, token digests, or exact dates.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 "$USER@$HOST" \
            'cd /home/pzd-staging/pzd-staging/current && /opt/pzd-node26/bin/node --input-type=module -' <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          import pg from 'pg';
          const coarse = value => {
            const n = Number(value);
            if (!Number.isSafeInteger(n) || n < 0) throw new Error('Bad aggregate');
            return n === 0 ? 'none' : n < 5 ? 'suppressed (1–4)' : n < 20 ? '5–19' : '20+';
          };
          let db;
          try {
            const env = readFileSync('/home/pzd-staging/pzd-staging/staging.env', 'utf8');
            const line = env.split(/\r?\n/).find(x => /^PZD_STAGING_DATABASE_URL=/.test(x));
            if (!line) throw new Error('No staging database configuration');
            let value = line.slice('PZD_STAGING_DATABASE_URL='.length).trim();
            if ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
            const target = new URL(value);
            if (!['127.0.0.1', 'localhost'].includes(target.hostname) ||
                target.pathname !== '/pzd_staging') throw new Error('Not staging DB');
            db = new pg.Client({ connectionString: value, connectionTimeoutMillis: 3000 });
            await db.connect();
            await db.query('BEGIN TRANSACTION READ ONLY');
            await db.query("SET LOCAL statement_timeout = '3000ms'");
            const check = await db.query(
              "SELECT to_regclass('public.pzd_guest_families') IS NOT NULL AS family, " +
              "to_regclass('public.tournament_daily_claim') IS NOT NULL AS claim, " +
              "to_regclass('public.tournament_device_credential') IS NOT NULL AS device, " +
              "to_regclass('public.tournament_series_writer') IS NOT NULL AS writer, " +
              "EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND " +
              " table_name='tournament_series_writer' AND column_name='original_device_credential_id') AS anchor"
            );
            const ready = check.rows[0];
            console.log('### Revoked guest account recovery evidence (staging, read-only)');
            console.log();
            console.log('Only coarse aggregate results are printed; this cannot attribute any row to an iPhone.');
            console.log('| Schema gate | Result |');
            console.log('| --- | --- |');
            for (const [label, ok] of [
              ['Guest families', ready.family],
              ['Daily claim', ready.claim],
              ['Registered device key', ready.device],
              ['Writer table', ready.writer],
              ['Original writer credential anchor', ready.anchor]
            ]) console.log('| ' + label + ' | ' + (ok ? 'PRESENT' : 'MISSING') + ' |');
            if (Object.values(ready).every(v => v === true)) {
              const summary = await db.query(
                "SELECT COUNT(*)::int AS revoked_families, " +
                "COUNT(*) FILTER (WHERE EXISTS (" +
                " SELECT 1 FROM public.tournament_daily_claim c WHERE c.player_id=f.player_id::text" +
                "))::int AS with_claim, " +
                "COUNT(*) FILTER (WHERE EXISTS (" +
                " SELECT 1 FROM public.tournament_device_credential d " +
                " WHERE d.player_id=f.player_id AND d.revoked_at_ms IS NULL" +
                "))::int AS with_registered_key, " +
                "COUNT(*) FILTER (WHERE EXISTS (" +
                " SELECT 1 FROM public.tournament_daily_claim c " +
                " JOIN public.tournament_series_writer w ON w.series_key=c.series_id::text " +
                " JOIN public.tournament_device_credential d ON d.credential_id=w.original_device_credential_id " +
                " WHERE c.player_id=f.player_id::text AND d.player_id=f.player_id AND d.revoked_at_ms IS NULL" +
                "))::int AS with_original_writer_key " +
                "FROM public.pzd_guest_families f WHERE f.revoked_at IS NOT NULL"
              );
              console.log();
              console.log('| Revoked family evidence | Coarse count |');
              console.log('| --- | --- |');
              const row = summary.rows[0];
              for (const [label, value] of [
                ['Revoked guest families', row.revoked_families],
                ['With saved daily claim', row.with_claim],
                ['With unrevoked registered device key', row.with_registered_key],
                ['With original writer-anchored device key', row.with_original_writer_key]
              ]) console.log('| ' + label + ' | ' + coarse(value) + ' |');
            } else {
              console.log('Recovery evidence check BLOCKED by missing schema; not a negative result.');
            }
            await db.query('ROLLBACK');
            console.log();
            console.log('A stored device key is not account ownership proof until a fresh cryptographic challenge is verified.');
            console.log('This workflow does not enable, perform or authorize guest linking.');
          } catch {
            console.log('Revoked account evidence inspection unavailable; details intentionally withheld.');
            process.exitCode = 1;
          } finally {
            if (db) await db.end().catch(() => {});
          }
          JS


      - name: Trace prior manifest gameplay by guest family state (read-only, suppressed)
        shell: bash
        env:
          HOST: ${{ secrets.PZD_STAGING_HOST }}
          USER: ${{ secrets.PZD_STAGING_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 "$USER@$HOST" \
            'cd /home/pzd-staging/pzd-staging/current && /opt/pzd-node26/bin/node --input-type=module -' <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          import pg from 'pg';
          const bucket = v => {
            const n = Number(v);
            if (!Number.isSafeInteger(n) || n < 0) throw new Error('Invalid count');
            return n === 0 ? 'none' : n < 5 ? 'suppressed (1–4)' : n < 20 ? '5–19' : '20+';
          };
          let db;
          try {
            const env = readFileSync('/home/pzd-staging/pzd-staging/staging.env', 'utf8');
            const line = env.split(/\r?\n/).find(x => /^PZD_STAGING_DATABASE_URL=/.test(x));
            if (!line) throw new Error('Missing config');
            let urlString = line.slice('PZD_STAGING_DATABASE_URL='.length).trim();
            if ((urlString.startsWith('"') && urlString.endsWith('"')) ||
                (urlString.startsWith("'") && urlString.endsWith("'"))) urlString = urlString.slice(1, -1);
            const url = new URL(urlString);
            if (!['127.0.0.1', 'localhost'].includes(url.hostname) ||
                url.pathname !== '/pzd_staging') throw new Error('Invalid DB');
            db = new pg.Client({ connectionString: urlString, connectionTimeoutMillis: 3000 });
            await db.connect();
            await db.query('BEGIN TRANSACTION READ ONLY');
            await db.query("SET LOCAL statement_timeout = '3000ms'");
            const checks = await db.query(
              "SELECT to_regclass('public.tournament_daily_claim') IS NOT NULL AS claims, " +
              "to_regclass('public.accepted_move_ledger') IS NOT NULL AS moves, " +
              "to_regclass('public.tournament_daily_series_completion') IS NOT NULL AS completion, " +
              "to_regclass('public.tournament_daily_result_category') IS NOT NULL AS scores, " +
              "to_regclass('public.pzd_guest_families') IS NOT NULL AS guest, " +
              "to_regclass('public.tournament_verified_identity') IS NOT NULL AS identity"
            );
            if (!Object.values(checks.rows[0]).every(v => v === true)) throw new Error('Incomplete schema');
            const result = await db.query(
              "WITH claims AS (SELECT c.series_id, c.original_utc_date, c.player_id, " +
              "CASE WHEN vi.player_id IS NULL THEN 'identity_unmatched' " +
              "WHEN vi.issuer <> 'https://staging.puzzle-duel.app' THEN 'other_issuer' " +
              "WHEN EXISTS (SELECT 1 FROM public.pzd_guest_families f " +
              "WHERE f.player_id::text=vi.subject AND f.revoked_at IS NOT NULL) THEN 'revoked_guest' " +
              "WHEN EXISTS (SELECT 1 FROM public.pzd_guest_families f " +
              "WHERE f.player_id::text=vi.subject AND f.revoked_at IS NULL) THEN 'active_guest' " +
              "ELSE 'guest_no_family' END AS guest_state " +
              "FROM public.tournament_daily_claim c LEFT JOIN public.tournament_verified_identity vi " +
              "ON vi.player_id::text=c.player_id WHERE c.original_utc_date IN " +
              "(DATE '2026-11-20', DATE '2026-11-21', DATE '2026-11-22')), " +
              "facts AS (SELECT c.original_utc_date AS day, c.guest_state, c.player_id, c.series_id, " +
              "EXISTS(SELECT 1 FROM public.accepted_move_ledger l WHERE l.series_key=c.series_id::text " +
              "AND l.player_id=c.player_id) AS has_move, " +
              "EXISTS(SELECT 1 FROM public.tournament_daily_series_completion k " +
              "WHERE k.series_id=c.series_id AND k.player_id=c.player_id) AS completed, " +
              "EXISTS(SELECT 1 FROM public.tournament_daily_result_category s " +
              "WHERE s.series_id=c.series_id) AS published FROM claims c) " +
              "SELECT day::text AS day, guest_state, COUNT(*)::int AS claim_count, " +
              "COUNT(*) FILTER(WHERE has_move)::int AS played_series, " +
              "COUNT(*) FILTER(WHERE completed)::int AS completed_series, " +
              "COUNT(*) FILTER(WHERE published)::int AS published_series " +
              "FROM facts GROUP BY day,guest_state ORDER BY day,guest_state"
            );
            await db.query('ROLLBACK');
            console.log('### Previous manifest identity-chain evidence (read-only)');
            console.log();
            console.log('Counts 1–4 are suppressed; no individual player, credential, score, or series is printed.');
            console.log('Identity relationship: daily_claim.player_id -> verified_identity.player_id -> verified_identity.subject -> guest_families.player_id. Family state is CURRENT; it does not imply status on the original play date.');
            console.log('| UTC manifest date | Current guest state | Claims | With accepted moves | Completed | Published |');
            console.log('| --- | --- | --- | --- | --- | --- |');
            const days = ['2026-11-20', '2026-11-21', '2026-11-22'];
            const states = ['active_guest','revoked_guest','guest_no_family','other_issuer','identity_unmatched'];
            for (const day of days) for (const state of states) {
              const r = result.rows.find(r => r.day === day && r.guest_state === state);
              console.log('| ' + day + ' | ' + state + ' | ' +
                bucket(r?.claim_count ?? 0) + ' | ' + bucket(r?.played_series ?? 0) + ' | ' +
                bucket(r?.completed_series ?? 0) + ' | ' + bucket(r?.published_series ?? 0) + ' |');
            }
            console.log();
            console.log('This does not identify the iPhone owner and does not authorize linking or reviving guest credentials.');
          } catch {
            console.log('Prior manifest evidence check unavailable; details withheld.');
            process.exitCode = 1;
          } finally {
            if (db) await db.end().catch(() => {});
          }
